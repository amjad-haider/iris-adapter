services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: iris
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris_local_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - iris_pgdata:/var/lib/postgresql/data
      - ./migrations/001_create_staging.sql:/docker-entrypoint-initdb.d/20_001_create_staging.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "iris", "-d", "iris"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  iris_pgdata: